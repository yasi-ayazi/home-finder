services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_finder}
      POSTGRES_USER: ${POSTGRES_USER:-home_finder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-home_finder}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ./server
      target: migration
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-home_finder}:${POSTGRES_PASSWORD:-home_finder}@postgres:5432/${POSTGRES_DB:-home_finder}
      STORAGE_ROOT: /app/storage
    command: ["npm", "run", "db:migrate"]
    volumes:
      - property_media:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./server
      target: migration
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-home_finder}:${POSTGRES_PASSWORD:-home_finder}@postgres:5432/${POSTGRES_DB:-home_finder}
      STORAGE_ROOT: /app/storage
    command: ["node", "dist/db/seed.js"]
    volumes:
      - property_media:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  server:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-home_finder}:${POSTGRES_PASSWORD:-home_finder}@postgres:5432/${POSTGRES_DB:-home_finder}
      UI_ORIGIN: http://localhost:${UI_PORT:-5173}
      STORAGE_ROOT: /app/storage
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - property_media:/app/storage:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    ports:
      - "${UI_PORT:-5173}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  property_media:
