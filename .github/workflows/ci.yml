name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: home_finder_test
          POSTGRES_USER: home_finder
          POSTGRES_PASSWORD: home_finder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U home_finder -d home_finder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://home_finder:home_finder@localhost:5432/home_finder_test
      TEST_DATABASE_URL: postgres://home_finder:home_finder@localhost:5432/home_finder_test
      STORAGE_ROOT: ${{ github.workspace }}/server/storage
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm test
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [ui, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run test:e2e
        working-directory: ui
      - if: ${{ failure() }}
        run: docker compose logs --no-color
      - if: ${{ always() }}
        run: docker compose down --volumes
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14
